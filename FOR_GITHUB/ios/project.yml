name: VTuberTracker
options:
  bundleIdPrefix: com.vtuber
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
targets:
  VTuberTracker:
    type: application
    platform: iOS
    sources:
      - VTuberTracker
    info:
      path: VTuberTracker/Info.plist
      properties:
        CFBundleDisplayName: "VTuber Tracker"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "TrueDepth front camera is required for real-time 60 FPS face and hand tracking."
        NSLocalNetworkUsageDescription: "Local network access is required to transmit UDP tracking frames to the Windows PC host."
        NSBluetoothAlwaysUsageDescription: "Bluetooth is used to stream low-latency tracking telemetry directly to your PC."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vtuber.tracker
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
