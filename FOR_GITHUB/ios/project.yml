name: VTuberTracker
options:
  bundleIdPrefix: com.vtuber
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
targets:
  VTuberTracker:
    type: application
    platform: iOS
    sources:
      - VTuberTracker
    info:
      path: VTuberTracker/Info.plist
      properties:
        CFBundleDisplayName: "VTuber Tracker"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vtuber.tracker
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.9"
